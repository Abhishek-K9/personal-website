<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Boba</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #fff8f0;
                margin: 0;
                padding: 0;
            }

            header {
                background-color: #ffcccb;
                padding: 20px;
                text-align: center;
            }

            h1 {
                margin: 0;
                font-size: 3em;
            }

            .intro {
                text-align: center;
                padding: 20px;
                font-size: 1.2em;
            }

            .menu {
                display: flex;
                justify-content: center;
                gap: 40px;
                padding: 20px;
            }

            .menu-item {
                text-align: center;
                background-color: #ffe5e5;
                padding: 15px;
                border-radius: 10px;
                width: 200px;
                box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            }

            .menu-item img {
                width: 100%;
                border-radius: 8px;
            }

            footer {
                background-color: #ffcccb;
                text-align: center;
                padding: 15px;
                margin-top: 20px;
            }
        </style>
    </head>

    <body>

        <header>
            <h1>My Favourite Boba Flavours</h1>
        </header>
        
        <div class="menu">
            <div class="menu-item">
                <img src="https://img.freepik.com/premium-vector/boba-coffee-tea-clipart_1245719-2898.jpg?w=360"
                    alt="Classic Milk Tea">
                <h3>Classic Milk Tea</h3>
                <p>Rich black tea with creamy milk and chewy boba.</p>
            </div>
            <div class="menu-item">
                <img src="https://www.creativefabrica.com/wp-content/uploads/2021/03/31/Strawberry-Laughing-Kawaii-Boba-Graphics-10188301-1-1-580x387.jpg"
                    alt="Strawberry Boba">
                <h3>Strawberry Boba</h3>
                <p>Fruity and fun with sweet strawberry flavor!</p>
            </div>
            <div class="menu-item">
                <img src="https://www.shutterstock.com/image-illustration/green-tea-bubble-clipart-600nw-2475223873.jpg"
                    alt="Matcha Latte">
                <h3>Matcha Latte</h3>
                <p>Earthy matcha blended with creamy milk and pearls.</p>
            </div>
        </div>

        <footer>
            <p>Abhishek Kapadia</p>
        </footer>

    </body>

</html>
